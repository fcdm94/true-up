<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Up — Verified Marketplace</title>
  <!-- Подключение Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Подключение React и Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Иконки Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0A0A0C] text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        title: 'Nike Air Jordan 1 Retro High OG',
        brand: 'Nike',
        category: 'Кроссовки',
        price: 24990,
        image: 'https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&q=80&w=800',
        description: 'Легендарные баскетбольные кроссовки в оригинальной расцветке. Премиальная кожа, проверенная подлинность.',
        sizes: ['41 EU', '42 EU', '43 EU', '44 EU']
      },
      {
        id: '2',
        title: 'Travis Scott x Air Jordan T-Shirt',
        brand: 'Jordan',
        category: 'Одежда',
        price: 12500,
        image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800',
        description: 'Футболка из оверсайз лимитированной коллекции. Плотный хлопок 280г/м².',
        sizes: ['M', 'L', 'XL']
      },
      {
        id: '3',
        title: 'Supreme Box Logo Beanie Black',
        brand: 'Supreme',
        category: 'Аксессуары',
        price: 8900,
        image: 'https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?auto=format&fit=crop&q=80&w=800',
        description: 'Классическая шапка с вышитым логотипом Box Logo.',
        sizes: ['One Size']
      },
      {
        id: '4',
        title: 'Yeezy Boost 350 V2 Onyx',
        brand: 'Adidas',
        category: 'Кроссовки',
        price: 28900,
        image: 'https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&q=80&w=800',
        description: 'Технология амортизации Boost и верхом Primeknit.',
        sizes: ['40 EU', '41 EU', '42 EU', '43 EU']
      }
    ];

    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('trueup_products');
        return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
      });

      const [selectedCategory, setSelectedCategory] = useState('Все');
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [selectedProduct, setSelectedProduct] = useState(null);
      const [selectedSize, setSelectedSize] = useState('');

      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState('');

      const [showAddProductModal, setShowAddProductModal] = useState(false);
      const [newProduct, setNewProduct] = useState({
        title: '', brand: '', category: 'Кроссовки', price: '', image: '', description: '', sizes: '40, 41, 42, 43'
      });

      const [isChatOpen, setIsChatOpen] = useState(false);
      const [chatMessages, setChatMessages] = useState(() => {
        const saved = localStorage.getItem('trueup_chat');
        return saved ? JSON.parse(saved) : [
          { id: 1, sender: 'support', text: 'Здравствуйте! Я администратор True Up. Чем могу помочь?', time: '12:00' }
        ];
      });
      const [inputMessage, setInputMessage] = useState('');
      const [adminReplyText, setAdminReplyText] = useState('');

      useEffect(() => {
        localStorage.setItem('trueup_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('trueup_chat', JSON.stringify(chatMessages));
      }, [chatMessages]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const categories = ['Все', 'Кроссовки', 'Одежда', 'Аксессуары'];
      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategory === 'Все' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.brand.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'trueup2026') {
          setIsAdmin(true);
          setShowAdminModal(false);
          setAdminPassword('');
          setAdminError('');
        } else {
          setAdminError('Неверный пароль администратора!');
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.title || !newProduct.price || !newProduct.image) return;

        const item = {
          id: Date.now().toString(),
          title: newProduct.title,
          brand: newProduct.brand || 'True Up',
          category: newProduct.category,
          price: Number(newProduct.price),
          image: newProduct.image,
          description: newProduct.description || 'Оригинал True Up Verified.',
          sizes: newProduct.sizes.split(',').map(s => s.trim())
        };

        setProducts([item, ...products]);
        setShowAddProductModal(false);
        setNewProduct({ title: '', brand: '', category: 'Кроссовки', price: '', image: '', description: '', sizes: '40, 41, 42, 43' });
      };

      const handleDeleteProduct = (id) => {
        if (window.confirm('Удалить этот товар?')) {
          setProducts(products.filter(p => p.id !== id));
        }
      };

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMessage.trim()) return;

        setChatMessages(prev => [...prev, {
          id: Date.now(),
          sender: 'user',
          text: inputMessage,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
        setInputMessage('');
      };

      const handleAdminReply = (e) => {
        e.preventDefault();
        if (!adminReplyText.trim()) return;

        setChatMessages(prev => [...prev, {
          id: Date.now(),
          sender: 'support',
          text: adminReplyText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }]);
        setAdminReplyText('');
      };

      const addToCart = (product, size) => {
        if (!size) return alert('Выберите размер!');
        setCart(prev => [...prev, { ...product, cartId: Date.now(), selectedSize: size }]);
        setSelectedProduct(null);
        setIsCartOpen(true);
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      return (
        <div className="min-h-screen bg-[#0A0A0C] text-white">
          {/* Хедер */}
          <header className="sticky top-0 z-40 bg-[#0A0A0C]/90 backdrop-blur-md border-b border-white/10">
            <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-blue-600 px-3 py-1.5 rounded-xl font-extrabold text-xl text-black shadow-lg shadow-blue-600/30">
                  TU
                </div>
                <div>
                  <span className="text-2xl font-black tracking-widest text-white">TRUE UP</span>
                  <span className="block text-[10px] text-blue-400 font-semibold tracking-wider">VERIFIED MARKETPLACE</span>
                </div>
              </div>

              <div className="flex-1 max-w-md hidden md:block">
                <input 
                  type="text"
                  placeholder="Поиск кроссовок, одежды, брендов..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-full text-sm text-white focus:outline-none focus:border-blue-500"
                />
              </div>

              <div className="flex items-center gap-3">
                {isAdmin ? (
                  <div className="flex items-center gap-2">
                    <button onClick={() => setShowAddProductModal(true)} className="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold">
                      + Добавить вещь
                    </button>
                    <button onClick={() => setIsAdmin(false)} className="px-3 py-2 bg-red-500/20 text-red-400 rounded-xl text-xs font-medium">
                      Выйти
                    </button>
                  </div>
                ) : (
                  <button onClick={() => setShowAdminModal(true)} className="px-3 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-xs text-gray-300">
                    🔒 Вход Админа
                  </button>
                )}

                <button onClick={() => setIsChatOpen(!isChatOpen)} className="p-2.5 bg-white/5 border border-white/10 rounded-xl text-blue-400">
                  💬
                </button>

                <button onClick={() => setIsCartOpen(true)} className="relative p-2.5 bg-blue-600 text-white rounded-xl">
                  🛒
                  {cart.length > 0 && (
                    <span className="absolute -top-1.5 -right-1.5 bg-white text-black font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center">
                      {cart.length}
                    </span>
                  )}
                </button>
              </div>
            </div>
          </header>

          {/* Баннер */}
          <div className="border-b border-white/5 bg-gradient-to-b from-blue-950/30 to-[#0A0A0C] py-12 text-center">
            <h1 className="text-4xl font-black uppercase tracking-tight">НАЙДИ СВОЙ <span className="text-blue-500">TRUE</span> СТИЛЬ</h1>
            <p className="text-gray-400 text-sm mt-2">Платформа оригинальных лимитированных кроссовок и одежды с гарантией аутентичности</p>
          </div>

          {/* Каталог */}
          <main className="max-w-7xl mx-auto px-4 py-8">
            <div className="flex gap-2 mb-8 overflow-x-auto">
              {categories.map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  className={`px-5 py-2 rounded-xl text-sm font-bold transition ${
                    selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400 border border-white/10'
                  }`}
                >
                  {cat}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {filteredProducts.map(p => (
                <div key={p.id} className="bg-[#121216] border border-white/10 rounded-2xl overflow-hidden flex flex-col justify-between">
                  <div>
                    <div className="relative aspect-square">
                      <img src={p.image} alt={p.title} className="w-full h-full object-cover" />
                      {isAdmin && (
                        <button onClick={() => handleDeleteProduct(p.id)} className="absolute top-2 right-2 bg-red-600 text-white p-2 rounded-lg text-xs">
                          Удалить
                        </button>
                      )}
                    </div>
                    <div className="p-4">
                      <span className="text-xs text-blue-400 font-bold uppercase">{p.brand}</span>
                      <h3 className="font-bold text-sm text-white mt-1">{p.title}</h3>
                      <p className="text-xs text-gray-400 mt-1 line-clamp-2">{p.description}</p>
                    </div>
                  </div>

                  <div className="p-4 pt-0 flex items-center justify-between border-t border-white/5 mt-2">
                    <span className="text-lg font-black text-white">{p.price.toLocaleString('ru-RU')} ₽</span>
                    <button 
                      onClick={() => { setSelectedProduct(p); setSelectedSize(p.sizes[0] || ''); }}
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl"
                    >
                      Купить
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </main>

          {/* Модалка товара */}
          {selectedProduct && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#121216] border border-white/10 rounded-3xl max-w-lg w-full p-6 relative">
                <button onClick={() => setSelectedProduct(null)} className="absolute top-4 right-4 text-gray-400">✕</button>
                <div className="flex gap-4">
                  <img src={selectedProduct.image} className="w-32 h-32 object-cover rounded-xl" />
                  <div>
                    <h3 className="font-bold text-lg">{selectedProduct.title}</h3>
                    <div className="text-xl font-black text-blue-500 my-2">{selectedProduct.price.toLocaleString('ru-RU')} ₽</div>
                    <div className="flex flex-wrap gap-2 mb-4">
                      {selectedProduct.sizes.map(s => (
                        <button 
                          key={s} 
                          onClick={() => setSelectedSize(s)}
                          className={`px-3 py-1 rounded-lg text-xs font-bold border ${selectedSize === s ? 'bg-blue-600 border-blue-500' : 'bg-white/5 border-white/10'}`}
                        >
                          {s}
                        </button>
                      ))}
                    </div>
                    <button onClick={() => addToCart(selectedProduct, selectedSize)} className="w-full py-2.5 bg-blue-600 font-bold rounded-xl text-sm">
                      В корзину
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Чат */}
          {isChatOpen && (
            <div className="fixed bottom-4 right-4 z-50 w-80 bg-[#121216] border border-white/10 rounded-2xl overflow-hidden shadow-2xl flex flex-col h-96">
              <div className="p-3 bg-blue-600 text-white font-bold text-sm flex justify-between">
                <span>Поддержка True Up</span>
                <button onClick={() => setIsChatOpen(false)}>✕</button>
              </div>
              <div className="flex-1 p-3 overflow-y-auto space-y-2">
                {chatMessages.map(m => (
                  <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className={`px-3 py-1.5 rounded-xl text-xs ${m.sender === 'user' ? 'bg-blue-600' : 'bg-white/10'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>
              {isAdmin && (
                <form onSubmit={handleAdminReply} className="p-2 border-t border-white/10 bg-blue-950/30 flex gap-1">
                  <input 
                    type="text" 
                    placeholder="Ответ админа..." 
                    value={adminReplyText} 
                    onChange={e => setAdminReplyText(e.target.value)} 
                    className="flex-1 px-2 py-1 bg-white/5 border border-white/10 rounded text-xs"
                  />
                  <button type="submit" className="px-2 py-1 bg-blue-600 text-xs rounded font-bold">Ответить</button>
                </form>
              )}
              <form onSubmit={handleSendMessage} className="p-2 border-t border-white/10 flex gap-1">
                <input 
                  type="text" 
                  placeholder="Задать вопрос..." 
                  value={inputMessage} 
                  onChange={e => setInputMessage(e.target.value)} 
                  className="flex-1 px-2 py-1 bg-white/5 border border-white/10 rounded text-xs"
                />
                <button type="submit" className="px-2 py-1 bg-blue-600 text-xs rounded font-bold">Отправить</button>
              </form>
            </div>
          )}

          {/* Модалка входа админа */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#121216] border border-white/10 rounded-2xl p-6 max-w-xs w-full text-center">
                <h3 className="font-bold text-lg mb-2">Вход Админа</h3>
                <p className="text-xs text-gray-400 mb-4">Пароль по умолчанию: <span className="text-blue-400 font-mono">trueup2026</span></p>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input 
                    type="password" 
                    placeholder="Пароль" 
                    value={adminPassword} 
                    onChange={e => setAdminPassword(e.target.value)}
                    className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-sm"
                  />
                  {adminError && <p className="text-xs text-red-400">{adminError}</p>}
                  <button type="submit" className="w-full py-2 bg-blue-600 font-bold rounded-xl text-sm">Войти</button>
                </form>
              </div>
            </div>
          )}

          {/* Модалка добавления товара */}
          {showAddProductModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#121216] border border-white/10 rounded-2xl p-6 max-w-md w-full relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setShowAddProductModal(false)} className="absolute top-4 right-4 text-gray-400">✕</button>
                <h3 className="font-bold text-lg mb-4">Добавить новую вещь</h3>
                <form onSubmit={handleAddProduct} className="space-y-3 text-xs">
                  <input type="text" required placeholder="Название товара" value={newProduct.title} onChange={e => setNewProduct({...newProduct, title: e.target.value})} className="w-full p-2.5 bg-white/5 border border-white/10 rounded-xl" />
                  <input type="text" placeholder="Бренд" value={newProduct.brand} onChange={e => setNewProduct({...newProduct, brand: e.target.value})} className="w-full p-2.5 bg-white/5 border border-white/10 rounded-xl" />
                  <input type="number" required placeholder="Цена (₽)" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="w-full p-2.5 bg-white/5 border border-white/10 rounded-xl" />
                  <input type="url" required placeholder="Ссылка на фото (URL)" value={newProduct.image} onChange={e => setNewProduct({...newProduct, image: e.target.value})} className="w-full p-2.5 bg-white/5 border border-white/10 rounded-xl" />
                  <input type="text" placeholder="Размеры через запятую" value={newProduct.sizes} onChange={e => setNewProduct({...newProduct, sizes: e.target.value})} className="w-full p-2.5 bg-white/5 border border-white/10 rounded-xl" />
                  <textarea placeholder="Описание" value={newProduct.description} onChange={e => setNewProduct({...newProduct, description: e.target.value})} className="w-full p-2.5 bg-white/5 border border-white/10 rounded-xl resize-none" />
                  <button type="submit" className="w-full py-3 bg-blue-600 font-bold rounded-xl text-sm">Опубликовать</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
