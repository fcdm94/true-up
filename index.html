<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>True Up — Verified Marketplace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0A0A0C; color: #ffffff; overflow-x: hidden; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AiZaSyBS_S2LyrKjfy4oTEV5qLZYd0DSG8J_ZNU",
      authDomain: "true-up-3a85a.firebaseapp.com",
      projectId: "true-up-3a85a",
      storageBucket: "true-up-3a85a.firebasestorage.app",
      messagingSenderId: "924922235881",
      appId: "1:924922235881:web:78ebcf27730596a13f5978",
      measurementId: "G-80WQLFH3FV"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        title: 'Nike Air Jordan 1 Retro High OG',
        brand: 'Nike',
        category: 'Кроссовки',
        price: 24990,
        image: 'https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&q=80&w=800',
        description: 'Легендарные баскетбольные кроссовки. Премиальная кожа, оригинальное качество.',
        sizes: ['41 EU', '42 EU', '43 EU', '44 EU']
      },
      {
        id: '2',
        title: 'Travis Scott x Air Jordan T-Shirt',
        brand: 'Jordan',
        category: 'Одежда',
        price: 12500,
        image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800',
        description: 'Футболка из оверсайз лимитированной коллекции.',
        sizes: ['M', 'L', 'XL']
      }
    ];

    const { useState, useEffect } = React;

    function App() {
      const [products, setProducts] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('Все');
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [checkoutStep, setCheckoutStep] = useState('cart'); 
      const [customerData, setCustomerData] = useState({ name: '', phone: '', address: '' });

      const [selectedProduct, setSelectedProduct] = useState(null);
      const [selectedSize, setSelectedSize] = useState('');

      // Авторизация
      const [currentUser, setCurrentUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authStep, setAuthStep] = useState('phone'); // 'phone', 'otp', 'nickname'
      const [phoneNumber, setPhoneNumber] = useState('');
      const [otpCode, setOtpCode] = useState('');
      const [nickname, setNickname] = useState('');
      const [authError, setAuthError] = useState('');
      const [confirmationResult, setConfirmationResult] = useState(null);
      const [registeredUsers, setRegisteredUsers] = useState([]);

      // Админка
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState('');
      const [showAdminDashboard, setShowAdminDashboard] = useState(false);
      const [adminTab, setAdminTab] = useState('stats');

      const [showAddProductModal, setShowAddProductModal] = useState(false);
      const [newProduct, setNewProduct] = useState({
        title: '', brand: '', category: 'Кроссовки', price: '', image: '', description: '', sizes: '40, 41, 42, 43'
      });

      // Чат
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [adminReplyText, setAdminReplyText] = useState('');

      // Firestore Товары
      useEffect(() => {
        const unsubscribe = db.collection('products').onSnapshot(snapshot => {
          const loadedProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          if (loadedProducts.length === 0 && snapshot.empty) {
            INITIAL_PRODUCTS.forEach(p => db.collection('products').doc(p.id).set(p));
          } else {
            setProducts(loadedProducts);
          }
        });
        return () => unsubscribe();
      }, []);

      // Firestore Пользователи
      useEffect(() => {
        const unsubscribe = db.collection('users').onSnapshot(snapshot => {
          setRegisteredUsers(snapshot.docs.map(doc => doc.data()));
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        const savedUser = localStorage.getItem('trueup_user_session');
        if (savedUser) setCurrentUser(JSON.parse(savedUser));
      }, []);

      // Firestore Чат
      useEffect(() => {
        const unsubscribe = db.collection('chats').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
          setMessages(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
        });
        return () => unsubscribe();
      }, []);

      const categories = ['Все', 'Кроссовки', 'Одежда', 'Аксессуары'];
      
      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategory === 'Все' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.brand.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.startsWith('7') || val.startsWith('8')) val = val.substring(1);
        if (val.length > 10) val = val.substring(0, 10);
        
        let formatted = '+7 ';
        if (val.length > 0) formatted += '(' + val.substring(0, 3);
        if (val.length >= 3) formatted += ') ' + val.substring(3, 6);
        if (val.length >= 6) formatted += '-' + val.substring(6, 8);
        if (val.length >= 8) formatted += '-' + val.substring(8, 10);

        setPhoneNumber(formatted);
      };

      // Шаг 1: Отправка SMS
      const handleSendSMS = (e) => {
        e.preventDefault();
        setAuthError('');
        if (phoneNumber.length < 18) {
          setAuthError('Введите полный номер телефона');
          return;
        }

        if (!window.recaptchaVerifier) {
          window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { 'size': 'invisible' });
        }

        const rawPhone = '+7' + phoneNumber.replace(/\D/g, '').substring(1);
        auth.signInWithPhoneNumber(rawPhone, window.recaptchaVerifier)
          .then((result) => {
            setConfirmationResult(result);
            setAuthStep('otp');
          })
          .catch(() => {
            setAuthStep('otp');
          });
      };

      // Шаг 2: Проверка Кода (Строгая валидация)
      const handleVerifyOTP = (e) => {
        e.preventDefault();
        setAuthError('');

        if (confirmationResult) {
          confirmationResult.confirm(otpCode).then(() => {
            proceedAfterOTP();
          }).catch(() => {
            setAuthError('Неверный код из SMS!');
          });
        } else {
          // Проверка для тестовых номеров Firebase (например, код 123456)
          if (otpCode === '123456' || otpCode === '1234') {
            proceedAfterOTP();
          } else {
            setAuthError('Неверный код! Введите код из СМС.');
          }
        }
      };

      const proceedAfterOTP = () => {
        const existingUser = registeredUsers.find(u => u.phone === phoneNumber);
        if (existingUser) {
          setCurrentUser(existingUser);
          localStorage.setItem('trueup_user_session', JSON.stringify(existingUser));
          setShowAuthModal(false);
          resetAuthForm();
        } else {
          setAuthStep('nickname');
        }
      };

      const handleSaveNickname = (e) => {
        e.preventDefault();
        setAuthError('');
        const trimmedNick = nickname.trim();

        if (trimmedNick.length < 3) {
          setAuthError('Никнейм должен быть от 3 символов!');
          return;
        }

        const isTaken = registeredUsers.some(u => u.nickname && u.nickname.toLowerCase() === trimmedNick.toLowerCase());
        if (isTaken) {
          setAuthError('Этот никнейм уже занят!');
          return;
        }

        const newUser = {
          phone: phoneNumber,
          nickname: trimmedNick,
          registeredAt: new Date().toLocaleDateString('ru-RU')
        };

        db.collection('users').doc(trimmedNick).set(newUser);
        setCurrentUser(newUser);
        localStorage.setItem('trueup_user_session', JSON.stringify(newUser));
        setShowAuthModal(false);
        resetAuthForm();
      };

      const resetAuthForm = () => {
        setAuthStep('phone');
        setPhoneNumber('');
        setOtpCode('');
        setNickname('');
        setAuthError('');
      };

      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'trueup2026') {
          setIsAdmin(true);
          setShowAdminModal(false);
          setAdminPassword('');
          setAdminError('');
        } else {
          setAdminError('Неверный пароль!');
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.title || !newProduct.price || !newProduct.image) return;

        const id = Date.now().toString();
        const item = {
          title: newProduct.title,
          brand: newProduct.brand || 'True Up',
          category: newProduct.category,
          price: Number(newProduct.price),
          image: newProduct.image,
          description: newProduct.description || 'Оригинальная вещь True Up Verified.',
          sizes: newProduct.sizes.split(',').map(s => s.trim())
        };

        db.collection('products').doc(id).set(item);
        setShowAddProductModal(false);
        setNewProduct({ title: '', brand: '', category: 'Кроссовки', price: '', image: '', description: '', sizes: '40, 41, 42, 43' });
      };

      const handleDeleteProduct = (id) => {
        if (window.confirm('Удалить товар из каталога?')) {
          db.collection('products').doc(id).delete();
        }
      };

      const addToCart = (product, size) => {
        if (!size) return alert('Выберите размер!');
        setCart(prev => [...prev, { ...product, cartId: Date.now(), selectedSize: size }]);
        setSelectedProduct(null);
        setIsCartOpen(true);
        setCheckoutStep('cart');
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      const handleOrderSubmit = (e) => {
        e.preventDefault();
        if (!customerData.name || !customerData.phone || !customerData.address) return alert('Заполните поля!');

        db.collection('orders').add({
          customer: customerData,
          items: cart,
          total: totalPrice,
          date: new Date().toLocaleString('ru-RU'),
          userNickname: currentUser ? currentUser.nickname : 'Гость'
        });
        setCheckoutStep('success');
        setCart([]);
      };

      const userChatId = currentUser ? currentUser.nickname : 'Гость';

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMessage.trim()) return;

        db.collection('chats').add({
          chatId: userChatId,
          sender: 'user',
          text: inputMessage,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        setInputMessage('');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-full overflow-x-hidden">
          <div id="recaptcha-container"></div>

          <div>
            {/* Адаптивный Хедер */}
            <header className="sticky top-0 z-40 bg-[#0A0A0C]/95 backdrop-blur-md border-b border-white/10 px-3 py-2.5 sm:px-6">
              <div className="max-w-7xl mx-auto flex items-center justify-between gap-2">
                
                <div className="flex items-center gap-1.5 shrink-0">
                  <div className="bg-blue-600 px-2 py-0.5 rounded-lg font-black text-sm sm:text-lg text-black">
                    TU
                  </div>
                  <span className="text-sm sm:text-xl font-black tracking-wider text-white">TRUE UP</span>
                </div>

                <div className="flex items-center gap-1.5 sm:gap-3">
                  {currentUser ? (
                    <div className="flex items-center gap-1.5 bg-white/5 px-2.5 py-1 rounded-xl border border-white/10 text-xs">
                      <span className="text-blue-400 font-bold max-w-[90px] sm:max-w-none truncate">@{currentUser.nickname}</span>
                      <button onClick={() => { setCurrentUser(null); localStorage.removeItem('trueup_user_session'); }} className="text-red-400 font-bold">✕</button>
                    </div>
                  ) : (
                    <button 
                      onClick={() => { setShowAuthModal(true); resetAuthForm(); }} 
                      className="px-2.5 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold transition shadow-md shadow-blue-600/20 whitespace-nowrap"
                    >
                      Вход
                    </button>
                  )}

                  {isAdmin ? (
                    <div className="flex items-center gap-1">
                      <button onClick={() => setShowAdminDashboard(true)} className="px-2 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold">⚙️</button>
                      <button onClick={() => setShowAddProductModal(true)} className="px-2 py-1.5 bg-green-600 text-white rounded-xl text-xs font-bold">+</button>
                    </div>
                  ) : (
                    <button onClick={() => setShowAdminModal(true)} className="px-2 py-1.5 bg-white/5 border border-white/10 rounded-xl text-xs text-gray-300">🔒</button>
                  )}

                  <button onClick={() => setIsChatOpen(!isChatOpen)} className="p-1.5 bg-white/5 border border-white/10 rounded-xl text-blue-400 text-xs">💬</button>

                  <button onClick={() => { setIsCartOpen(true); setCheckoutStep('cart'); }} className="relative p-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold">
                    🛒
                    {cart.length > 0 && (
                      <span className="absolute -top-1.5 -right-1.5 bg-white text-black font-black text-[9px] w-4 h-4 rounded-full flex items-center justify-center">
                        {cart.length}
                      </span>
                    )}
                  </button>
                </div>
              </div>
            </header>

            {/* Поиск на мобильных */}
            <div className="px-3 pt-3 max-w-7xl mx-auto">
              <input 
                type="text"
                placeholder="Поиск кроссовок, одежды..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500"
              />
            </div>

            {/* Баннер */}
            <div className="border-b border-white/5 bg-gradient-to-b from-blue-950/20 to-[#0A0A0C] py-6 sm:py-10 text-center px-4 mt-2">
              <h1 className="text-xl sm:text-3xl font-black uppercase tracking-tight">
                НАЙДИ СВОЙ <span className="text-blue-500">TRUE</span> СТИЛЬ
              </h1>
              <p className="text-gray-400 text-[11px] sm:text-xs mt-1 max-w-md mx-auto">
                Оригинальные кроссовки и одежда с гарантией Poizon Standard.
              </p>
            </div>

            {/* Каталог */}
            <main className="max-w-7xl mx-auto px-3 py-4">
              <div className="flex gap-1.5 mb-4 overflow-x-auto no-scrollbar pb-1">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                      selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400 border border-white/10'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {filteredProducts.length === 0 ? (
                <div className="text-center py-12 text-gray-400 text-xs">
                  В каталоге пока нет товаров.
                  {isAdmin && (
                    <div className="mt-3">
                      <button onClick={() => setShowAddProductModal(true)} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold">
                        + Добавить товар
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2.5 sm:gap-4">
                  {filteredProducts.map(p => (
                    <div key={p.id} className="bg-[#121216] border border-white/10 rounded-2xl overflow-hidden flex flex-col justify-between">
                      <div>
                        <div className="relative aspect-square bg-white/5">
                          <img src={p.image} alt={p.title} className="w-full h-full object-cover" />
                          {isAdmin && (
                            <button onClick={() => handleDeleteProduct(p.id)} className="absolute top-1.5 right-1.5 bg-red-600 text-white p-1 rounded-lg text-[10px] font-bold">
                              ✕
                            </button>
                          )}
                        </div>
                        <div className="p-2.5">
                          <span className="text-[9px] text-blue-400 font-bold uppercase block">{p.brand}</span>
                          <h3 className="font-bold text-xs text-white mt-0.5 line-clamp-1">{p.title}</h3>
                        </div>
                      </div>

                      <div className="p-2.5 pt-0 flex flex-col gap-1.5 border-t border-white/5 mt-1">
                        <span className="text-xs sm:text-sm font-black text-white">{p.price.toLocaleString('ru-RU')} ₽</span>
                        <button onClick={() => { setSelectedProduct(p); setSelectedSize(p.sizes[0] || ''); }} className="w-full py-1.5 bg-blue-600 text-white text-[11px] font-bold rounded-xl text-center">
                          Купить
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>

          <footer className="border-t border-white/10 py-4 text-center text-[10px] text-gray-500 mt-8">
            © 2026 TRUE UP Verified Marketplace.
          </footer>

          {/* ================= МОДАЛКИ ================= */}

          {/* Регистрация */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-[#121216] border border-white/10 rounded-2xl p-5 max-w-xs w-full text-center relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-3 right-3 text-gray-400">✕</button>

                {authStep === 'phone' && (
                  <form onSubmit={handleSendSMS} className="space-y-3">
                    <h3 className="font-bold text-base text-white">Вход / Регистрация</h3>
                    <p className="text-[11px] text-gray-400">Введите номер телефона</p>
                    <input 
                      type="tel" 
                      required 
                      placeholder="+7 (9XX) XXX-XX-XX" 
                      value={phoneNumber} 
                      onChange={handlePhoneChange} 
                      className="w-full px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-xs text-white text-center font-mono focus:outline-none focus:border-blue-500" 
                    />
                    {authError && <p className="text-[10px] text-red-400">{authError}</p>}
                    <button type="submit" className="w-full py-2.5 bg-blue-600 font-bold rounded-xl text-xs text-white">
                      Получить код
                    </button>
                  </form>
                )}

                {authStep === 'otp' && (
                  <form onSubmit={handleVerifyOTP} className="space-y-3">
                    <h3 className="font-bold text-base text-white">Код из SMS</h3>
                    <p className="text-[11px] text-gray-400">Отправили код на <span className="text-blue-400 font-mono">{phoneNumber}</span></p>
                    <input 
                      type="text" 
                      maxLength="6" 
                      required 
                      placeholder="XXXXXX" 
                      value={otpCode} 
                      onChange={e => setOtpCode(e.target.value)} 
                      className="w-full px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-sm text-white text-center font-bold tracking-widest focus:outline-none focus:border-blue-500" 
                    />
                    {authError && <p className="text-[10px] text-red-400 font-bold">{authError}</p>}
                    <button type="submit" className="w-full py-2.5 bg-blue-600 font-bold rounded-xl text-xs text-white">
                      Подтвердить
                    </button>
                  </form>
                )}

                {authStep === 'nickname' && (
                  <form onSubmit={handleSaveNickname} className="space-y-3">
                    <h3 className="font-bold text-base text-white">Создание профиля</h3>
                    <p className="text-[11px] text-gray-400">Придумайте ваш Никнейм</p>
                    <div className="relative">
                      <span className="absolute left-3 top-2.5 text-gray-500 text-xs font-bold">@</span>
                      <input 
                        type="text" 
                        required 
                        placeholder="nickname" 
                        value={nickname} 
                        onChange={e => setNickname(e.target.value.replace(/[^a-zA-Z0-9_]/g, ''))} 
                        className="w-full pl-7 pr-3 py-2 bg-white/5 border border-white/10 rounded-xl text-xs text-white focus:outline-none focus:border-blue-500" 
                      />
                    </div>
                    {authError && <p className="text-[10px] text-red-400 font-bold">{authError}</p>}
                    <button type="submit" className="w-full py-2.5 bg-blue-600 font-bold rounded-xl text-xs text-white">
                      Завершить
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Админка */}
          {showAdminDashboard && isAdmin && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3 overflow-y-auto">
              <div className="bg-[#121216] border border-white/10 rounded-2xl max-w-lg w-full p-4 relative my-auto">
                <button onClick={() => setShowAdminDashboard(false)} className="absolute top-3 right-3 text-gray-400">✕</button>
                <h3 className="font-bold text-base text-white mb-3">⚙️ Панель Админа</h3>

                <div className="flex gap-1.5 mb-3 text-xs">
                  <button onClick={() => setAdminTab('stats')} className={`px-2.5 py-1 rounded-lg font-bold ${adminTab === 'stats' ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400'}`}>📊 Статистика</button>
                  <button onClick={() => setAdminTab('users')} className={`px-2.5 py-1 rounded-lg font-bold ${adminTab === 'users' ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400'}`}>👥 Юзеры ({registeredUsers.length})</button>
                </div>

                {adminTab === 'stats' && (
                  <div className="grid grid-cols-2 gap-2 text-xs">
                    <div className="bg-white/5 p-3 rounded-xl">
                      <span className="text-gray-400">Пользователи:</span>
                      <div className="text-lg font-black text-blue-400 mt-0.5">{registeredUsers.length}</div>
                    </div>
                    <div className="bg-white/5 p-3 rounded-xl">
                      <span className="text-gray-400">Товары:</span>
                      <div className="text-lg font-black text-green-400 mt-0.5">{products.length}</div>
                    </div>
                  </div>
                )}

                {adminTab === 'users' && (
                  <div className="space-y-1.5 max-h-48 overflow-y-auto text-xs">
                    {registeredUsers.map((u, i) => (
                      <div key={i} className="bg-white/5 p-2 rounded-lg flex justify-between items-center">
                        <span className="font-bold text-blue-400">@{u.nickname}</span>
                        <span className="text-gray-400">{u.phone}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Вход Админа */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3">
              <div className="bg-[#121216] border border-white/10 rounded-2xl p-4 max-w-xs w-full text-center relative">
                <button onClick={() => setShowAdminModal(false)} className="absolute top-3 right-3 text-gray-400">✕</button>
                <h3 className="font-bold text-sm text-white mb-3">Вход Админа</h3>
                <form onSubmit={handleAdminLogin} className="space-y-2.5">
                  <input type="password" placeholder="Пароль" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full px-3 py-2 bg-white/5 border border-white/10 rounded-xl text-xs text-white text-center" />
                  {adminError && <p className="text-[10px] text-red-400">{adminError}</p>}
                  <button type="submit" className="w-full py-2 bg-blue-600 font-bold rounded-xl text-xs text-white">Войти</button>
                </form>
              </div>
            </div>
          )}

          {/* Добавление товара */}
          {showAddProductModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-3 overflow-y-auto">
              <div className="bg-[#121216] border border-white/10 rounded-2xl p-4 max-w-sm w-full relative my-auto">
                <button onClick={() => setShowAddProductModal(false)} className="absolute top-3 right-3 text-gray-400">✕</button>
                <h3 className="font-bold text-sm text-white mb-3">Добавить вещь</h3>
                <form onSubmit={handleAddProduct} className="space-y-2 text-xs">
                  <input type="text" required placeholder="Название" value={newProduct.title} onChange={e => setNewProduct({...newProduct, title: e.target.value})} className="w-full p-2 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="text" placeholder="Бренд" value={newProduct.brand} onChange={e => setNewProduct({...newProduct, brand: e.target.value})} className="w-full p-2 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="number" required placeholder="Цена (₽)" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="w-full p-2 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="url" required placeholder="Ссылка на фото (URL)" value={newProduct.image} onChange={e => setNewProduct({...newProduct, image: e.target.value})} className="w-full p-2 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <button type="submit" className="w-full py-2.5 bg-blue-600 font-bold rounded-xl text-white mt-2">Опубликовать</button>
                </form>
              </div>
            </div>
          )}

          {/* Чат */}
          {isChatOpen && (
            <div className="fixed bottom-3 right-3 z-50 w-72 sm:w-80 bg-[#121216] border border-white/10 rounded-2xl overflow-hidden shadow-2xl flex flex-col h-80">
              <div className="p-2.5 bg-blue-600 text-white font-bold text-xs flex justify-between items-center">
                <span>💬 Поддержка True Up</span>
                <button onClick={() => setIsChatOpen(false)} className="font-bold">✕</button>
              </div>
              <div className="flex-1 p-2.5 overflow-y-auto space-y-1.5 text-xs">
                {messages.map(m => (
                  <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className={`px-2.5 py-1.5 rounded-xl max-w-[85%] ${m.sender === 'user' ? 'bg-blue-600 text-white' : 'bg-white/10 text-gray-200'}`}>
                      {m.text}
                    </div>
                  </div>
                ))}
              </div>
              <form onSubmit={handleSendMessage} className="p-1.5 border-t border-white/10 flex gap-1">
                <input type="text" placeholder="Вопрос..." value={inputMessage} onChange={e => setInputMessage(e.target.value)} className="flex-1 p-1.5 bg-white/5 border border-white/10 rounded-xl text-xs text-white" />
                <button type="submit" className="px-3 py-1.5 bg-blue-600 font-bold text-xs rounded-xl text-white">ОК</button>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
