<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>True Up — Verified Marketplace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0A0A0C; color: #ffffff; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white">
  <div id="root"></div>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script type="text/babel">
    // Инициализация Firebase с вашими ключами
    const firebaseConfig = {
      apiKey: "AiZaSyBS_S2LyrKjfy4oTEV5qLZYd0DSG8J_ZNU",
      authDomain: "true-up-3a85a.firebaseapp.com",
      projectId: "true-up-3a85a",
      storageBucket: "true-up-3a85a.firebasestorage.app",
      messagingSenderId: "924922235881",
      appId: "1:924922235881:web:78ebcf27730596a13f5978",
      measurementId: "G-80WQLFH3FV"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const INITIAL_PRODUCTS = [
      {
        id: '1',
        title: 'Nike Air Jordan 1 Retro High OG',
        brand: 'Nike',
        category: 'Кроссовки',
        price: 24990,
        image: 'https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&q=80&w=800',
        description: 'Легендарные баскетбольные кроссовки. Премиальная кожа, оригинальное качество.',
        sizes: ['41 EU', '42 EU', '43 EU', '44 EU']
      },
      {
        id: '2',
        title: 'Travis Scott x Air Jordan T-Shirt',
        brand: 'Jordan',
        category: 'Одежда',
        price: 12500,
        image: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&q=80&w=800',
        description: 'Футболка из оверсайз лимитированной коллекции.',
        sizes: ['M', 'L', 'XL']
      }
    ];

    const { useState, useEffect } = React;

    function App() {
      const [products, setProducts] = useState([]);
      const [selectedCategory, setSelectedCategory] = useState('Все');
      const [searchQuery, setSearchQuery] = useState('');
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [checkoutStep, setCheckoutStep] = useState('cart'); 
      const [customerData, setCustomerData] = useState({ name: '', phone: '', address: '' });

      const [selectedProduct, setSelectedProduct] = useState(null);
      const [selectedSize, setSelectedSize] = useState('');

      // Авторизация по номеру, SMS и Никнейму
      const [currentUser, setCurrentUser] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authStep, setAuthStep] = useState('phone'); // 'phone', 'otp', 'nickname'
      const [phoneNumber, setPhoneNumber] = useState('');
      const [otpCode, setOtpCode] = useState('');
      const [nickname, setNickname] = useState('');
      const [authError, setAuthError] = useState('');
      const [confirmationResult, setConfirmationResult] = useState(null);
      const [registeredUsers, setRegisteredUsers] = useState([]);

      // Админка
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [adminError, setAdminError] = useState('');
      const [showAdminDashboard, setShowAdminDashboard] = useState(false);
      const [adminTab, setAdminTab] = useState('stats');

      const [showAddProductModal, setShowAddProductModal] = useState(false);
      const [newProduct, setNewProduct] = useState({
        title: '', brand: '', category: 'Кроссовки', price: '', image: '', description: '', sizes: '40, 41, 42, 43'
      });

      // Чат
      const [isChatOpen, setIsChatOpen] = useState(false);
      const [messages, setMessages] = useState([]);
      const [inputMessage, setInputMessage] = useState('');
      const [adminReplyText, setAdminReplyText] = useState('');
      const [activeChatId, setActiveChatId] = useState('');

      // Синхронизация Firestore товаров Real-time
      useEffect(() => {
        const unsubscribe = db.collection('products').onSnapshot(snapshot => {
          const loadedProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          if (loadedProducts.length === 0 && snapshot.empty) {
            // Заполняем начальными товарами при первом запуске
            INITIAL_PRODUCTS.forEach(p => db.collection('products').doc(p.id).set(p));
          } else {
            setProducts(loadedProducts);
          }
        });
        return () => unsubscribe();
      }, []);

      // Синхронизация пользователей
      useEffect(() => {
        const unsubscribe = db.collection('users').onSnapshot(snapshot => {
          const users = snapshot.docs.map(doc => doc.data());
          setRegisteredUsers(users);
        });
        return () => unsubscribe();
      }, []);

      // Проверка авторизации
      useEffect(() => {
        const savedUser = localStorage.getItem('trueup_user_session');
        if (savedUser) setCurrentUser(JSON.parse(savedUser));
      }, []);

      // Синхронизация сообщений чата
      useEffect(() => {
        const unsubscribe = db.collection('chats').orderBy('timestamp', 'asc').onSnapshot(snapshot => {
          const msgs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          setMessages(msgs);
        });
        return () => unsubscribe();
      }, []);

      const categories = ['Все', 'Кроссовки', 'Одежда', 'Аксессуары'];
      
      const filteredProducts = products.filter(p => {
        const matchesCategory = selectedCategory === 'Все' || p.category === selectedCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              p.brand.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      // Маска телефона
      const handlePhoneChange = (e) => {
        let val = e.target.value.replace(/\D/g, '');
        if (val.startsWith('7') || val.startsWith('8')) val = val.substring(1);
        if (val.length > 10) val = val.substring(0, 10);
        
        let formatted = '+7 ';
        if (val.length > 0) formatted += '(' + val.substring(0, 3);
        if (val.length >= 3) formatted += ') ' + val.substring(3, 6);
        if (val.length >= 6) formatted += '-' + val.substring(6, 8);
        if (val.length >= 8) formatted += '-' + val.substring(8, 10);

        setPhoneNumber(formatted);
      };

      // Шаг 1: Отправка SMS
      const handleSendSMS = (e) => {
        e.preventDefault();
        setAuthError('');
        if (phoneNumber.length < 18) {
          setAuthError('Введите полный номер телефона: +7 (9XX) XXX-XX-XX');
          return;
        }

        if (!window.recaptchaVerifier) {
          window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
            'size': 'invisible'
          });
        }

        const rawPhone = '+7' + phoneNumber.replace(/\D/g, '').substring(1);
        
        auth.signInWithPhoneNumber(rawPhone, window.recaptchaVerifier)
          .then((result) => {
            setConfirmationResult(result);
            setAuthStep('otp');
          })
          .catch((err) => {
            // Для демо-теста при лимитах SMS пропуск на следующий шаг
            setAuthStep('otp');
          });
      };

      // Шаг 2: Проверка Кода из SMS
      const handleVerifyOTP = (e) => {
        e.preventDefault();
        setAuthError('');
        if (!otpCode || otpCode.length < 4) {
          setAuthError('Введите код из сообщения!');
          return;
        }

        // Проверка существующего пользователя
        const rawPhone = phoneNumber;
        const existingUser = registeredUsers.find(u => u.phone === rawPhone);

        if (existingUser) {
          setCurrentUser(existingUser);
          localStorage.setItem('trueup_user_session', JSON.stringify(existingUser));
          setShowAuthModal(false);
          resetAuthForm();
        } else {
          setAuthStep('nickname');
        }
      };

      // Шаг 3: Сохранение Никнейма
      const handleSaveNickname = (e) => {
        e.preventDefault();
        setAuthError('');
        const trimmedNick = nickname.trim();

        if (trimmedNick.length < 3) {
          setAuthError('Никнейм должен быть не короче 3 символов!');
          return;
        }

        const isTaken = registeredUsers.some(u => u.nickname.toLowerCase() === trimmedNick.toLowerCase());
        if (isTaken) {
          setAuthError('Этот никнейм уже занят! Выберите другой.');
          return;
        }

        const newUser = {
          phone: phoneNumber,
          nickname: trimmedNick,
          registeredAt: new Date().toLocaleDateString('ru-RU')
        };

        db.collection('users').doc(trimmedNick).set(newUser);
        setCurrentUser(newUser);
        localStorage.setItem('trueup_user_session', JSON.stringify(newUser));
        setShowAuthModal(false);
        resetAuthForm();
      };

      const resetAuthForm = () => {
        setAuthStep('phone');
        setPhoneNumber('');
        setOtpCode('');
        setNickname('');
        setAuthError('');
      };

      // Вход Админа
      const handleAdminLogin = (e) => {
        e.preventDefault();
        if (adminPassword === 'trueup2026') {
          setIsAdmin(true);
          setShowAdminModal(false);
          setAdminPassword('');
          setAdminError('');
        } else {
          setAdminError('Неверный пароль администратора!');
        }
      };

      // Добавление / Удаление товара в Облаке Firestore
      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.title || !newProduct.price || !newProduct.image) return;

        const id = Date.now().toString();
        const item = {
          title: newProduct.title,
          brand: newProduct.brand || 'True Up',
          category: newProduct.category,
          price: Number(newProduct.price),
          image: newProduct.image,
          description: newProduct.description || 'Оригинальная вещь True Up Verified.',
          sizes: newProduct.sizes.split(',').map(s => s.trim())
        };

        db.collection('products').doc(id).set(item);
        setShowAddProductModal(false);
        setNewProduct({ title: '', brand: '', category: 'Кроссовки', price: '', image: '', description: '', sizes: '40, 41, 42, 43' });
      };

      const handleDeleteProduct = (id) => {
        if (window.confirm('Удалить этот товар у всех пользователей?')) {
          db.collection('products').doc(id).delete();
        }
      };

      // Корзина
      const addToCart = (product, size) => {
        if (!size) return alert('Выберите размер!');
        setCart(prev => [...prev, { ...product, cartId: Date.now(), selectedSize: size }]);
        setSelectedProduct(null);
        setIsCartOpen(true);
        setCheckoutStep('cart');
      };

      const removeFromCart = (cartId) => {
        setCart(cart.filter(item => item.cartId !== cartId));
      };

      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      const handleOrderSubmit = (e) => {
        e.preventDefault();
        if (!customerData.name || !customerData.phone || !customerData.address) {
          alert('Заполните все поля!');
          return;
        }

        const order = {
          customer: customerData,
          items: cart,
          total: totalPrice,
          date: new Date().toLocaleString('ru-RU'),
          userNickname: currentUser ? currentUser.nickname : 'Гость'
        };

        db.collection('orders').add(order);
        setCheckoutStep('success');
        setCart([]);
      };

      // Сообщения Чат
      const userChatId = currentUser ? currentUser.nickname : 'Гость';

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputMessage.trim()) return;

        db.collection('chats').add({
          chatId: userChatId,
          sender: 'user',
          text: inputMessage,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        setInputMessage('');
      };

      const handleAdminReply = (e) => {
        e.preventDefault();
        if (!adminReplyText.trim()) return;

        db.collection('chats').add({
          chatId: activeChatId || 'Гость',
          sender: 'support',
          text: adminReplyText,
          timestamp: firebase.firestore.FieldValue.serverTimestamp(),
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
        setAdminReplyText('');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div id="recaptcha-container"></div>
          <div>
            {/* Хедер */}
            <header className="sticky top-0 z-40 bg-[#0A0A0C]/95 backdrop-blur-md border-b border-white/10">
              <div className="max-w-7xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between gap-2">
                
                <div className="flex items-center gap-2">
                  <div className="bg-blue-600 px-2.5 py-1 rounded-xl font-extrabold text-lg sm:text-xl text-black shadow-lg shadow-blue-600/30">
                    TU
                  </div>
                  <div>
                    <span className="text-lg sm:text-2xl font-black tracking-widest text-white block leading-none">TRUE UP</span>
                    <span className="text-[8px] sm:text-[10px] text-blue-400 font-bold tracking-wider">VERIFIED MARKETPLACE</span>
                  </div>
                </div>

                <div className="flex-1 max-w-xs sm:max-w-md mx-2 hidden sm:block">
                  <input 
                    type="text"
                    placeholder="Поиск кроссовок, одежды..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full px-4 py-2 bg-white/5 border border-white/10 rounded-full text-xs sm:text-sm text-white focus:outline-none focus:border-blue-500"
                  />
                </div>

                <div className="flex items-center gap-1.5 sm:gap-3">
                  {currentUser ? (
                    <div className="flex items-center gap-2 bg-white/5 px-3 py-1.5 rounded-xl border border-white/10 text-xs">
                      <span className="text-blue-400 font-bold">@{currentUser.nickname}</span>
                      <button onClick={() => { setCurrentUser(null); localStorage.removeItem('trueup_user_session'); }} className="text-red-400 font-bold ml-1">Выйти</button>
                    </div>
                  ) : (
                    <button 
                      onClick={() => { setShowAuthModal(true); resetAuthForm(); }} 
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-blue-600/20"
                    >
                      Вход / Регистрация
                    </button>
                  )}

                  {isAdmin ? (
                    <div className="flex items-center gap-1.5">
                      <button onClick={() => setShowAdminDashboard(true)} className="px-2.5 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-bold">
                        ⚙️ Панель
                      </button>
                      <button onClick={() => setShowAddProductModal(true)} className="px-2.5 py-1.5 bg-green-600 text-white rounded-xl text-xs font-bold">
                        + Вещь
                      </button>
                      <button onClick={() => setIsAdmin(false)} className="p-1.5 text-red-400 text-xs">🚪</button>
                    </div>
                  ) : (
                    <button onClick={() => setShowAdminModal(true)} className="px-2.5 py-1.5 bg-white/5 border border-white/10 rounded-xl text-xs text-gray-300">
                      🔒 Админ
                    </button>
                  )}

                  <button onClick={() => setIsChatOpen(!isChatOpen)} className="p-2 bg-white/5 border border-white/10 rounded-xl text-blue-400">
                    💬
                  </button>

                  <button onClick={() => { setIsCartOpen(true); setCheckoutStep('cart'); }} className="relative p-2 bg-blue-600 text-white rounded-xl font-bold">
                    🛒
                    {cart.length > 0 && (
                      <span className="absolute -top-1.5 -right-1.5 bg-white text-black font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center">
                        {cart.length}
                      </span>
                    )}
                  </button>
                </div>
              </div>
            </header>

            {/* Баннер */}
            <div className="border-b border-white/5 bg-gradient-to-b from-blue-950/20 to-[#0A0A0C] py-8 text-center px-4">
              <h1 className="text-2xl sm:text-4xl font-black uppercase tracking-tight">
                НАЙДИ СВОЙ <span className="text-blue-500">TRUE</span> СТИЛЬ
              </h1>
              <p className="text-gray-400 text-xs sm:text-sm mt-2 max-w-xl mx-auto">
                Платформа оригинальных лимитированных кроссовок и одежды с гарантией Poizon Standard.
              </p>
            </div>

            {/* Каталог */}
            <main className="max-w-7xl mx-auto px-4 py-6">
              <div className="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-1">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition ${
                      selectedCategory === cat ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400 border border-white/10'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {filteredProducts.length === 0 ? (
                <div className="text-center py-16 text-gray-400 text-sm">
                  В каталоге пока нет товаров.
                  {isAdmin && (
                    <div className="mt-4">
                      <button onClick={() => setShowAddProductModal(true)} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold">
                        + Добавить первый товар
                      </button>
                    </div>
                  )}
                </div>
              ) : (
                <div className="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6">
                  {filteredProducts.map(p => (
                    <div key={p.id} className="bg-[#121216] border border-white/10 rounded-2xl overflow-hidden flex flex-col justify-between">
                      <div>
                        <div className="relative aspect-square bg-white/5">
                          <img src={p.image} alt={p.title} className="w-full h-full object-cover" />
                          {isAdmin && (
                            <button onClick={() => handleDeleteProduct(p.id)} className="absolute top-2 right-2 bg-red-600 text-white p-1.5 rounded-lg text-xs font-bold shadow-lg">
                              ✕
                            </button>
                          )}
                        </div>
                        <div className="p-3 sm:p-4">
                          <span className="text-[10px] sm:text-xs text-blue-400 font-bold uppercase">{p.brand}</span>
                          <h3 className="font-bold text-xs sm:text-sm text-white mt-0.5 line-clamp-1">{p.title}</h3>
                          <p className="text-[10px] sm:text-xs text-gray-400 mt-1 line-clamp-2">{p.description}</p>
                        </div>
                      </div>

                      <div className="p-3 sm:p-4 pt-0 flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-t border-white/5 mt-2">
                        <span className="text-sm sm:text-lg font-black text-white">{p.price.toLocaleString('ru-RU')} ₽</span>
                        <button onClick={() => { setSelectedProduct(p); setSelectedSize(p.sizes[0] || ''); }} className="w-full sm:w-auto px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-xl text-center">
                          Купить
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </main>
          </div>

          <footer className="border-t border-white/10 py-6 text-center text-xs text-gray-500 mt-12">
            © 2026 TRUE UP Verified Marketplace.
          </footer>

          {/* ================= МОДАЛЬНЫЕ ОКНА ================= */}

          {/* 3-этапная регистрация (Телефон ➔ Код ➔ Уникальный Ник) */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#121216] border border-white/10 rounded-3xl p-6 max-w-sm w-full text-center relative">
                <button onClick={() => setShowAuthModal(false)} className="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>

                {authStep === 'phone' && (
                  <form onSubmit={handleSendSMS} className="space-y-4">
                    <h3 className="font-bold text-lg text-white">Вход / Регистрация</h3>
                    <p className="text-xs text-gray-400">Введите номер телефона для получения SMS-кода</p>
                    <input 
                      type="tel" 
                      required 
                      placeholder="+7 (9XX) XXX-XX-XX" 
                      value={phoneNumber} 
                      onChange={handlePhoneChange} 
                      className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-sm text-white text-center focus:outline-none focus:border-blue-500 font-mono" 
                    />
                    {authError && <p className="text-xs text-red-400">{authError}</p>}
                    <button type="submit" className="w-full py-3 bg-blue-600 font-bold rounded-xl text-xs text-white">
                      Получить код
                    </button>
                  </form>
                )}

                {authStep === 'otp' && (
                  <form onSubmit={handleVerifyOTP} className="space-y-4">
                    <h3 className="font-bold text-lg text-white">Код из SMS</h3>
                    <p className="text-xs text-gray-400">Отправили код на номер <span className="text-blue-400 font-mono">{phoneNumber}</span></p>
                    <input 
                      type="text" 
                      maxLength="6" 
                      required 
                      placeholder="XXXX" 
                      value={otpCode} 
                      onChange={e => setOtpCode(e.target.value)} 
                      className="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-base text-white text-center tracking-widest font-bold focus:outline-none focus:border-blue-500" 
                    />
                    {authError && <p className="text-xs text-red-400">{authError}</p>}
                    <button type="submit" className="w-full py-3 bg-blue-600 font-bold rounded-xl text-xs text-white">
                      Подтвердить
                    </button>
                  </form>
                )}

                {authStep === 'nickname' && (
                  <form onSubmit={handleSaveNickname} className="space-y-4">
                    <h3 className="font-bold text-lg text-white">Создание профиля</h3>
                    <p className="text-xs text-gray-400">Придумайте ваш уникальный Никнейм на True Up</p>
                    <div className="relative">
                      <span className="absolute left-3 top-3.5 text-gray-500 text-sm font-bold">@</span>
                      <input 
                        type="text" 
                        required 
                        placeholder="your_nickname" 
                        value={nickname} 
                        onChange={e => setNickname(e.target.value.replace(/[^a-zA-Z0-9_]/g, ''))} 
                        className="w-full pl-8 pr-4 py-3 bg-white/5 border border-white/10 rounded-xl text-sm text-white focus:outline-none focus:border-blue-500" 
                      />
                    </div>
                    {authError && <p className="text-xs text-red-400">{authError}</p>}
                    <button type="submit" className="w-full py-3 bg-blue-600 font-bold rounded-xl text-xs text-white">
                      Завершить регистрацию
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Панель Администратора */}
          {showAdminDashboard && isAdmin && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#121216] border border-white/10 rounded-3xl max-w-2xl w-full p-5 sm:p-6 relative my-auto max-h-[90vh] flex flex-col">
                <button onClick={() => setShowAdminDashboard(false)} className="absolute top-4 right-4 bg-white/5 text-gray-300 w-8 h-8 rounded-full flex items-center justify-center font-bold">✕</button>
                
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-lg text-white flex items-center gap-2">
                    <span>⚙️</span> Панель Админа
                  </h3>
                  <button onClick={() => { setShowAdminDashboard(false); setShowAddProductModal(true); }} className="px-3 py-1.5 bg-blue-600 font-bold text-white rounded-xl text-xs">
                    + Добавить товар
                  </button>
                </div>

                <div className="flex gap-2 mb-4 overflow-x-auto pb-1 text-xs">
                  <button onClick={() => setAdminTab('stats')} className={`px-3 py-1.5 rounded-xl font-bold ${adminTab === 'stats' ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400'}`}>📊 Статистика</button>
                  <button onClick={() => setAdminTab('users')} className={`px-3 py-1.5 rounded-xl font-bold ${adminTab === 'users' ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400'}`}>👥 Пользователи ({registeredUsers.length})</button>
                  <button onClick={() => setAdminTab('chats')} className={`px-3 py-1.5 rounded-xl font-bold ${adminTab === 'chats' ? 'bg-blue-600 text-white' : 'bg-white/5 text-gray-400'}`}>💬 Поддержка</button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-4 text-xs">
                  {adminTab === 'stats' && (
                    <div className="grid grid-cols-2 gap-4">
                      <div className="bg-white/5 p-4 rounded-2xl border border-white/5">
                        <span className="text-gray-400">Пользователей</span>
                        <div className="text-2xl font-black text-blue-400 mt-1">{registeredUsers.length}</div>
                      </div>
                      <div className="bg-white/5 p-4 rounded-2xl border border-white/5">
                        <span className="text-gray-400">Товаров в каталоге</span>
                        <div className="text-2xl font-black text-green-400 mt-1">{products.length}</div>
                      </div>
                    </div>
                  )}

                  {adminTab === 'users' && (
                    <div className="space-y-2">
                      {registeredUsers.map((u, i) => (
                        <div key={i} className="bg-white/5 p-3 rounded-xl flex justify-between items-center">
                          <div>
                            <span className="font-bold text-blue-400 text-sm">@{u.nickname}</span>
                            <span className="block text-xs text-gray-300">{u.phone}</span>
                          </div>
                          <span className="text-[10px] text-gray-500">{u.registeredAt}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  {adminTab === 'chats' && (
                    <div className="space-y-3">
                      <div className="bg-black/50 p-3 rounded-xl max-h-48 overflow-y-auto space-y-2 border border-white/5">
                        {messages.map(m => (
                          <div key={m.id} className="text-[11px]">
                            <span className="font-bold text-blue-400">@{m.chatId} [{m.sender === 'user' ? 'Клиент' : 'Админ'}]:</span> <span className="text-gray-200">{m.text}</span>
                          </div>
                        ))}
                      </div>
                      <form onSubmit={handleAdminReply} className="flex gap-1">
                        <input type="text" placeholder="Ответ..." value={adminReplyText} onChange={e => setAdminReplyText(e.target.value)} className="flex-1 p-2 bg-white/5 border border-white/10 rounded-xl text-white" />
                        <button type="submit" className="px-4 py-2 bg-blue-600 font-bold rounded-xl text-white">Ответить</button>
                      </form>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Вход Админа */}
          {showAdminModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="bg-[#121216] border border-white/10 rounded-3xl p-6 max-w-xs w-full text-center relative">
                <button onClick={() => setShowAdminModal(false)} className="absolute top-3 right-3 text-gray-400">✕</button>
                <h3 className="font-bold text-lg text-white mb-4">Вход Админа</h3>
                <form onSubmit={handleAdminLogin} className="space-y-3">
                  <input type="password" placeholder="Пароль" value={adminPassword} onChange={e => setAdminPassword(e.target.value)} className="w-full px-3 py-2.5 bg-white/5 border border-white/10 rounded-xl text-xs text-white text-center" />
                  {adminError && <p className="text-xs text-red-400">{adminError}</p>}
                  <button type="submit" className="w-full py-2.5 bg-blue-600 font-bold rounded-xl text-xs text-white">Войти</button>
                </form>
              </div>
            </div>
          )}

          {/* Модалка Добавления Товара */}
          {showAddProductModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-[#121216] border border-white/10 rounded-3xl p-5 max-w-md w-full relative my-auto">
                <button onClick={() => setShowAddProductModal(false)} className="absolute top-4 right-4 bg-white/5 text-gray-300 w-8 h-8 rounded-full flex items-center justify-center font-bold">✕</button>
                <h3 className="font-bold text-lg text-white mb-4">Добавить новую вещь</h3>
                <form onSubmit={handleAddProduct} className="space-y-3 text-xs">
                  <input type="text" required placeholder="Название товара" value={newProduct.title} onChange={e => setNewProduct({...newProduct, title: e.target.value})} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="text" placeholder="Бренд" value={newProduct.brand} onChange={e => setNewProduct({...newProduct, brand: e.target.value})} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="number" required placeholder="Цена (₽)" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="url" required placeholder="Ссылка на фото (URL)" value={newProduct.image} onChange={e => setNewProduct({...newProduct, image: e.target.value})} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <input type="text" placeholder="Размеры через запятую" value={newProduct.sizes} onChange={e => setNewProduct({...newProduct, sizes: e.target.value})} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white" />
                  <textarea placeholder="Описание" value={newProduct.description} onChange={e => setNewProduct({...newProduct, description: e.target.value})} className="w-full p-3 bg-white/5 border border-white/10 rounded-xl text-white resize-none" />
                  <button type="submit" className="w-full py-3 bg-blue-600 font-bold rounded-xl text-white">Опубликовать</button>
                </form>
              </div>
            </div>
          )}

          {/* Чат поддержки */}
          {isChatOpen && (
            <div className="fixed bottom-4 right-4 z-50 w-80 sm:w-96 bg-[#121216] border border-white/10 rounded-3xl overflow-hidden shadow-2xl flex flex-col h-96">
              <div className="p-3 bg-blue-600 text-white font-bold text-xs sm:text-sm flex justify-between items-center">
                <span>💬 Поддержка True Up</span>
                <button onClick={() => setIsChatOpen(false)} className="text-white font-bold text-base">✕</button>
              </div>
              <div className="flex-1 p-3 overflow-y-auto space-y-2 text-xs">
                {messages.map(m => (
                  <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className={`px-3 py-2 rounded-2xl max-w-[85%] ${m.sender === 'user' ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white/10 text-gray-200 rounded-bl-none'}`}>
                      {m.text}
                    </div>
                    <span className="text-[9px] text-gray-500 mt-0.5">{m.time}</span>
                  </div>
                ))}
              </div>
              <form onSubmit={handleSendMessage} className="p-2 border-t border-white/10 flex gap-1">
                <input type="text" placeholder="Задать вопрос..." value={inputMessage} onChange={e => setInputMessage(e.target.value)} className="flex-1 p-2 bg-white/5 border border-white/10 rounded-xl text-xs text-white" />
                <button type="submit" className="px-3 py-2 bg-blue-600 font-bold text-xs rounded-xl text-white">Отправить</button>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
